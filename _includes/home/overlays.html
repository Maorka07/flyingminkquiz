<div class="login-modal" id="loginModal">
  <div class="login-box">
    <button class="login-close" onclick="closeProfile()">X</button>
    <h3 data-he="כניסה לחשבון" data-en="Login" data-de="Anmelden" data-ru="Вход">כניסה לחשבון</h3>
    <div class="login-tabs"><button class="login-tab active" onclick="switchLoginTab('login')">כניסה</button><button class="login-tab" onclick="switchLoginTab('register')">הרשמה</button></div>
    <div id="loginForm"><input class="c-input" id="loginEmail" placeholder="אימייל" type="email"><input class="c-input" id="loginPass" placeholder="סיסמה" type="password"><button class="btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="doLogin()">כניסה</button></div>
    <div id="registerForm" style="display:none"><input class="c-input" id="regName" placeholder="שם מלא"><input class="c-input" id="regEmail" placeholder="אימייל" type="email"><input class="c-input" id="regPass" placeholder="סיסמה" type="password"><button class="btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="doRegister()">הרשמה</button></div>
    <div id="loginMsg"></div>
  </div>
</div>

<div class="bot-bubble" onclick="toggleBot()"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 8V4H8"/><rect x="2" y="8" width="20" height="12" rx="2"/><path d="M6 16h0M18 16h0M10 16h4"/></svg></div>
<div class="bot-chat" id="botChat">
  <div class="bot-header"><div class="bot-header-title"><div class="dot"></div>Mink Bot</div><button class="bot-close" onclick="toggleBot()">X</button></div>
  <div class="bot-messages" id="botMsgs"><div class="bot-msg bot">היי! אני הבוט של Flying Mink. איך אפשר לעזור?</div></div>
  <div class="bot-quick" id="botQuick"><button onclick="botAsk('איזה רחפן מתאים לי?')">רחפן</button><button onclick="botAsk('כמה עולה שיעור?')">מחיר</button><button onclick="botAsk('איך יוצרים קשר?')">קשר</button><button onclick="botAsk('מה יש בקורס?')">קורס</button></div>
  <div class="bot-input-row"><input type="text" id="botInput" placeholder="שאל אותי משהו..." onkeypress="if(event.key==='Enter')sendBot()"><button onclick="sendBot()">שלח</button></div>
</div>
