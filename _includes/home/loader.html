<!-- ══════ MINK INTRO — first visit only, random scene (scripts: assets/js/intro/) ══════
     Scenes: chase (drone + lasers), hoops (dunk), goal (kick + backflip), race (race car).
     Skipped on return visits, with Save-Data or a 2G connection, and with reduced motion.
     Testing: ?intro=1 forces a random scene, ?intro=hoops (or chase / goal / race) forces that one,
     ?intro=0 skips it. -->
<style>
html.fm-intro-lock,html.fm-intro-lock body{overflow:hidden}
.fm-intro{position:fixed;inset:0;z-index:99999;overflow:hidden;cursor:pointer;
  background:radial-gradient(120% 80% at 50% 40%,#1d1747 0%,#151034 55%,#0e0a26 100%);
  display:grid;place-items:center;will-change:transform}
.fm-intro::after{content:"";position:absolute;inset:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));border:1px solid rgba(255,255,255,.22);border-radius:22px;pointer-events:none}
.fm-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.fm-scene{position:relative;width:min(560px,78%);display:grid;justify-items:center;gap:22px;margin-top:6%}
.fm-track{position:relative;width:75%;height:clamp(80px,12.5vw,115px);margin-bottom:-22px}
.fm-runner{position:absolute;bottom:-3px;left:0;width:clamp(150px,22vw,210px);will-change:transform}
.fm-cv{display:block;width:100%;height:auto;aspect-ratio:2/1;filter:drop-shadow(0 0 8px rgba(167,139,250,.45))}
.fm-plat{position:relative;width:75%;height:3px;border-radius:3px;background:rgba(167,139,250,.22)}
.fm-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;background:linear-gradient(90deg,#6d28d9,#a78bfa 70%,#fff);box-shadow:0 0 14px rgba(167,139,250,.6)}
.fm-mark{display:grid;justify-items:center;gap:6px;direction:ltr}
.fm-mark b{font-family:'Michroma','Heebo',system-ui,sans-serif;font-weight:400;font-size:clamp(.95rem,2.4vw,1.25rem);letter-spacing:.24em;color:#fff}
.fm-mark small{font-family:'Michroma','Heebo',system-ui,sans-serif;font-size:clamp(.55rem,1.3vw,.68rem);letter-spacing:.42em;color:#a59fc4}
</style>

<template id="fmIntroTpl">
  <div class="fm-intro" id="fmIntro" role="status" aria-label="Flying Mink נטען">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
    <div class="fm-scene">
      <div class="fm-track">
        <div class="fm-runner"><canvas class="fm-cv" width="340" height="170" aria-hidden="true"></canvas></div>
      </div>
      <div class="fm-plat"><div class="fm-fill"></div></div>
      <div class="fm-mark"><b>FLYING MINK</b><small>DRONE SOLUTIONS</small></div>
    </div>
    <canvas class="fm-fx" aria-hidden="true"></canvas>
  </div>
</template>

<script>
(function () {
  var q = location.search;
  var m = q.match(/[?&]intro=(1|chase|hoops|goal|race)(&|$)/);
  var force = !!m;
  var show = !/[?&]intro=0(&|$)/.test(q);
  try { if (!force && localStorage.getItem('fm-intro-seen')) show = false; } catch (e) { if (!force) show = false; }
  if (!force && show) {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) show = false;
    var c = navigator.connection;
    if (c && (c.saveData || /2g$/.test(c.effectiveType || ''))) show = false;
  }
  if (!show) return;

  try { localStorage.setItem('fm-intro-seen', String(Date.now())); } catch (e) {}
  window.fmIntroActive = true;                     // the hero video waits for the jump
  document.documentElement.classList.add('fm-intro-lock');
  var tpl = document.getElementById('fmIntroTpl');
  document.body.appendChild(tpl.content.cloneNode(true));

  var scenes = ['chase', 'hoops', 'goal', 'race'];
  var scene = m && m[1] !== '1' ? m[1] : scenes[Math.floor(Math.random() * scenes.length)];
  window.fmIntroScene = scene;
  var files = ['mink-rig.js', 'intro-scenes.js', 'mink-intro.js'];
  if (scene === 'chase') files.splice(1, 0, 'drone-chase.js');   // only the chase needs the drone
  files.forEach(function (f) {
    var s = document.createElement('script');
    s.src = 'assets/js/intro/' + f + '?v=20261028b';
    s.async = false;                               // keep execution order
    document.head.appendChild(s);
  });

  // safety net: if the scripts never arrive, hand the page back after 4 s
  setTimeout(function () {
    if (!window.fmIntroActive || window.fmIntroStarted) return;
    var el = document.getElementById('fmIntro'); if (el) el.remove();
    window.fmIntroActive = false;
    document.documentElement.classList.remove('fm-intro-lock');
    window.dispatchEvent(new Event('fm:intro-done'));
  }, 4000);
})();
</script>
