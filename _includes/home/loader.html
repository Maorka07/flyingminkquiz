<!-- ══════ LOADING SCREEN (FOUC fix) ══════ -->
<style>
#loadingScreen{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#0b0a16,#150f24);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.4s cubic-bezier(0.4,0,0.2,1),visibility 0.4s;overflow:hidden}
#loadingScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loadingScreen::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(109,40,217,0.25) 0%,transparent 60%);animation:pulseBg 3s ease-in-out infinite}
@keyframes pulseBg{0%,100%{opacity:0.6}50%{opacity:1}}
.loader-logo{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.05);border:2px solid rgba(167,139,250,0.4);display:flex;align-items:center;justify-content:center;position:relative;animation:logoFloat 2.5s ease-in-out infinite;backdrop-filter:blur(10px);z-index:2}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.05)}}
.loader-logo svg{width:80px;height:80px}
.loader-orbit{position:absolute;width:200px;height:200px;border:1px dashed rgba(167,139,250,0.3);border-radius:50%;animation:orbit 8s linear infinite;z-index:1}
.loader-orbit::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;background:#a78bfa;box-shadow:0 0 20px #a78bfa;transform:translateX(-50%)}
@keyframes orbit{to{transform:rotate(360deg)}}
.loader-orbit-2{position:absolute;width:280px;height:280px;border:1px dashed rgba(94,234,212,0.2);border-radius:50%;animation:orbit 12s linear infinite reverse;z-index:1}
.loader-orbit-2::before{content:"";position:absolute;bottom:-5px;left:50%;width:10px;height:10px;border-radius:50%;background:#5eead4;box-shadow:0 0 16px #5eead4;transform:translateX(-50%)}
.loader-text{margin-top:48px;color:#e2e8f0;font-family:'Heebo',sans-serif;font-size:18px;font-weight:600;letter-spacing:2px;z-index:2;animation:textFade 1.8s ease-in-out infinite}
@keyframes textFade{0%,100%{opacity:0.5}50%{opacity:1}}
.loader-subtext{margin-top:8px;color:#94a3b8;font-family:'Heebo',sans-serif;font-size:13px;letter-spacing:1px;z-index:2}
.loader-progress{position:absolute;bottom:60px;width:200px;height:2px;background:rgba(167,139,250,0.15);border-radius:2px;overflow:hidden;z-index:2}
.loader-progress::before{content:"";position:absolute;left:-30%;top:0;width:30%;height:100%;background:linear-gradient(90deg,transparent,#a78bfa,transparent);animation:progressSlide 1.5s ease-in-out infinite}
@keyframes progressSlide{0%{left:-30%}100%{left:130%}}
</style>

<div id="loadingScreen">
  <div class="loader-orbit-2"></div>
  <div class="loader-orbit"></div>
  <div class="loader-logo">
    <svg viewBox="0 0 140 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="direction:ltr">
      <g stroke="#a78bfa" stroke-width="1.5" fill="none">
        <line x1="52" y1="45" x2="20" y2="28" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="88" y1="45" x2="120" y2="28" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="52" y1="55" x2="25" y2="72" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="88" y1="55" x2="115" y2="72" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="20" cy="28" r="4" fill="rgba(167,139,250,0.3)" stroke-width="1.5"/>
        <circle cx="120" cy="28" r="4" fill="rgba(167,139,250,0.3)" stroke-width="1.5"/>
        <circle cx="25" cy="72" r="4" fill="rgba(167,139,250,0.3)" stroke-width="1.5"/>
        <circle cx="115" cy="72" r="4" fill="rgba(167,139,250,0.3)" stroke-width="1.5"/>
        <path d="M5 28 A15 4 0 0 1 35 28" stroke-width="1" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="0.4s" repeatCount="indefinite"/></path>
        <path d="M105 28 A15 4 0 0 1 135 28" stroke-width="1" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="0.4s" repeatCount="indefinite" begin="0.1s"/></path>
        <path d="M10 72 A15 4 0 0 1 40 72" stroke-width="1" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="0.4s" repeatCount="indefinite" begin="0.2s"/></path>
        <path d="M100 72 A15 4 0 0 1 130 72" stroke-width="1" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="0.4s" repeatCount="indefinite" begin="0.3s"/></path>
        <rect x="48" y="40" width="44" height="20" rx="8" fill="rgba(167,139,250,0.25)" stroke-width="1.8"/>
        <rect x="62" y="60" width="16" height="8" rx="3" fill="rgba(167,139,250,0.2)" stroke-width="1.2"/>
        <circle cx="70" cy="64" r="3" fill="rgba(167,139,250,0.4)" stroke-width="1"/>
      </g>
    </svg>
  </div>
  <div class="loader-text">FLYING MINK</div>
  <div class="loader-subtext">Drone Solutions</div>
  <div class="loader-progress"></div>
</div>

<script>
(function(){
  function hideLoader(){
    var ls = document.getElementById('loadingScreen');
    if(ls){
      ls.classList.add('hidden');
      setTimeout(function(){ if(ls.parentNode) ls.parentNode.removeChild(ls); }, 600);
    }
  }
  if(document.readyState === 'complete' || document.readyState === 'interactive'){
    setTimeout(hideLoader, 100);
  } else {
    document.addEventListener('DOMContentLoaded', function(){
      setTimeout(hideLoader, 100);
    });
  }
})();
</script>
