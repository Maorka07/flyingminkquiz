<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0b0d12">
<title>Maor Shtolz</title>
<style>
  :root {
    --navy: #100553;        /* UVID deep blue */
    --blue: #2c2982;        /* UVID mid blue */
    --teal: #83c0bf;        /* UVID accent */
    --linkedin: #0a66c2;
    --whatsapp: #25d366;
    --gap: 3px;
  }
  * { box-sizing: border-box; }
  html { background: #0b0d12; }
  body {
    position: relative;
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 3.4vh, 30px);
    padding: max(22px, env(safe-area-inset-top)) 14px max(22px, env(safe-area-inset-bottom));
    color: #fff;
    background:
      radial-gradient(120% 60% at 50% -10%, #1d2433 0%, transparent 70%),
      #0b0d12;
    font-family: -apple-system, BlinkMacSystemFont, "SF Hebrew", "Segoe UI", "Noto Sans Hebrew", "Heebo", "Arial Hebrew", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- who ---------- */
  .who { direction: ltr; text-align: center; }
  .who h1 {
    margin: 0;
    font-size: clamp(26px, 7.6vw, 36px);
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.1;
  }
  .who .rule {
    display: block;
    width: 44px;
    height: 3px;
    margin: 10px auto 9px;
    border-radius: 3px;
    background: rgba(255, 255, 255, .55);
  }
  .who p {
    margin: 0;
    font-size: clamp(13px, 3.7vw, 16px);
    line-height: 1.5;
    color: #c9ced8;
  }

  /* ---------- the split square ----------
     Physical layout: right half = CV, left half = two stacked quarters */
  .split {
    width: min(100%, 520px);
    aspect-ratio: 6 / 7;
    display: grid;
    direction: ltr;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: var(--gap);
    border-radius: 20px;
    overflow: hidden;
    background: #0b0d12;
    box-shadow: 0 18px 44px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .12);
  }
  .tile {
    position: relative;
    display: block;
    overflow: hidden;
    direction: rtl;
    transition: filter .15s ease;
  }
  .tile:active { filter: brightness(.86); }
  .tile:focus-visible, .bubble:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }

  .ih { grid-column: 1; grid-row: 1; }
  .fm { grid-column: 1; grid-row: 2; }
  .mg { grid-column: 1; grid-row: 3; }
  .cv { grid-column: 2; grid-row: 1 / span 3; }

  /* CV (right half) – black & white */
  .cv { background: #fff; }
  .cv-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Innovation Hub (top) */
  .ih { background: #000; display: flex; align-items: center; justify-content: center; padding-bottom: 17%; }
  .ih img { width: 86%; height: auto; }

  /* Flying Mink (middle) */
  .fm { background: #26302e; }
  .fm img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 45%;
  }
  .fm::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 34%;
    background: linear-gradient(to top, rgba(0, 0, 0, .55), transparent);
  }

  /* Meguyas (bottom-left quarter) */
  .mg { background: #2a2a33; }
  .mg-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 0% 42%;
  }
  .mg::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 36%;
    background: linear-gradient(to top, rgba(10, 8, 20, .80), transparent);
  }
  .mg-title {
    position: absolute;
    top: 9%;
    left: 50%;
    width: 64%;
    height: auto;
    transform: translateX(-50%);
    filter: drop-shadow(0 3px 9px rgba(40, 20, 10, .6));
  }

  .label {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    bottom: 7px;
    direction: ltr;
    text-align: center;
    font-size: clamp(10.5px, 3vw, 14px);
    font-weight: 600;
    letter-spacing: .04em;
  }
  .label svg { width: .8em; height: .8em; margin-left: .3em; vertical-align: -.05em; }

  /* ---------- bubbles ---------- */
  .bubbles { display: flex; direction: ltr; gap: clamp(20px, 7vw, 34px); }
  .bubble {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .14);
    transition: transform .15s ease, filter .15s ease;
  }
  .bubble:active { transform: scale(.93); filter: brightness(.9); }
  .bubble svg { width: 29px; height: 29px; }
  .b-in { background: var(--linkedin); }
  .b-wa { background: var(--whatsapp); }
  .b-tel { background: #fff; color: #0b0d12; }
  .b-tel svg { width: 26px; height: 26px; }

  /* ---------- opening: the square splits ---------- */
  @keyframes from-right { from { transform: translateX(104%); } to { transform: none; } }
  @keyframes from-left  { from { transform: translateX(-104%); } to { transform: none; } }
  @keyframes rise       { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fade       { from { opacity: 0; } to { opacity: 1; } }
  .cv { animation: from-right .7s cubic-bezier(.2, .8, .2, 1) both; }
  .ih { animation: from-left .7s cubic-bezier(.2, .8, .2, 1) .06s both; }
  .fm { animation: from-left .7s cubic-bezier(.2, .8, .2, 1) .13s both; }
  .mg { animation: from-left .7s cubic-bezier(.2, .8, .2, 1) .20s both; }
  .who { animation: rise .5s ease .1s both; }
    .bubble { animation: rise .45s ease both; }
  .bubble:nth-child(1) { animation-delay: .60s; }
  .bubble:nth-child(2) { animation-delay: .68s; }
  .bubble:nth-child(3) { animation-delay: .76s; }
  @media (prefers-reduced-motion: reduce) {
    .cv, .ih, .fm, .mg, .who, .bubble { animation: none; }
  }
</style>
</head>
